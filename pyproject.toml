[build-system]
requires = ["setuptools>=77.0,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "brainhub"
version = "0.1.0"
description = "Embeddable module runtime APIs for personal workflow capture"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["brainhub", "brainhub.*", "plugins", "plugins.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
